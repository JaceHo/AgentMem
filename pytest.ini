[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# One session-wide event loop for tests AND fixtures: global async state
# (mem_store's shared Redis pool, session-scoped app lifespans) must live on
# the same loop every test runs on — per-test loops made cross-loop globals
# raise "Event loop is closed" / "different task" errors.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    benchmark: marks tests as performance benchmarks
    asyncio: marks tests as async
